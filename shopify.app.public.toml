# 公開用アプリ（App Store 販売用）
# 同じコードベースを、別の Shopify アプリとして公開するための設定です。
# 1. パートナーダッシュボードで「新規アプリ」を作成（公開アプリ）
# 2. ここの client_id と application_url をそのアプリの値に差し替え
# 3. 公開用のデプロイ先（例: pos-stock.onrender.com）を用意し、そのURLを application_url に設定
# 4. shopify app config use public のあと shopify app deploy で公開用にデプロイ

client_id = "41d31838e05e4154fb75a6ccab558239"
name = "POS Stock"
application_url = "https://pos-stock.onrender.com"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-01"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = [ "inventory_levels/update" ]
  uri = "/webhooks/inventory_levels/update"

  # 必須コンプライアンス Webhook（App Store 審査で必須）
  # https://shopify.dev/docs/apps/build/compliance/privacy-law-compliance
  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
  uri = "/webhooks/compliance"

  # 既存の売上・返品履歴用 Webhook は公開用では受けない（2026-11-22 T の決定。read_orders も外した。docs/DECISIONS.md D18）。
  # 公開用の在庫の履歴では、売上・返品は「管理画面・その他」に入る（売上・返品に分けない）。
  # 戻すときは: 保護された顧客データ（Level 1）を申請して承認 → scopes に read_orders を足す →
  # app/utils/default-scopes.ts の PUBLIC_DEFAULT_SCOPES も直す → 下のコメントを外す → scripts/verify-app-mode.js の見張りを直す。
  # https://shopify.dev/docs/apps/launch/protected-customer-data
  # [[webhooks.subscriptions]]
  # topics = [ "orders/updated" ]
  # uri = "/webhooks/orders/updated"

  # [[webhooks.subscriptions]]
  # topics = [ "refunds/create" ]
  # uri = "/webhooks/refunds/create"

[access.admin]
direct_api_mode = "offline"
embedded_app_direct_api_access = true

# 取置のorders/paid通知は必須read_ordersが必要なため公開版では登録しない。
# 任意権限の承認後、注文番号による照合を使用する。

[access_scopes]
# read_users は制限付きスコープのため必須から除外。詳細: docs/ERROR_DEPLOY_READ_USERS_SCOPE.md
# read_orders は公開用では持たない（注文のデータを使わない。DECISIONS D18）。自社用の shopify.app.toml には残す。
scopes = "read_inventory,read_inventory_transfers,read_locations,read_products,write_inventory,write_inventory_shipments,write_inventory_shipments_received_items,write_inventory_transfers"
optional_scopes = [ "read_orders", "read_customers" ]

[auth]
redirect_urls = [ "https://pos-stock.onrender.com" ]
