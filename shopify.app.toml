# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "906bc9ebbe2a0812df1abfc257e378f1"
name = "POS Stock - Ciara"
application_url = "https://stock-transfer-pos.onrender.com"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-01"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = [ "inventory_levels/update" ]
  uri = "/webhooks/inventory_levels/update"

  # 必須コンプライアンス Webhook（App Store 審査で必須）
  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
  uri = "/webhooks/compliance"

  [[webhooks.subscriptions]]
  topics = [ "orders/updated" ]
  uri = "/webhooks/orders/updated"

  [[webhooks.subscriptions]]
  topics = [ "refunds/create" ]
  uri = "/webhooks/refunds/create"

[access.admin]
direct_api_mode = "offline"
embedded_app_direct_api_access = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
# read_users は制限付きスコープのため必須から除外。デプロイ時の app_access 検証エラーを避ける。スタッフ一覧はスコープ不足時は空で返す。詳細: docs/ERROR_DEPLOY_READ_USERS_SCOPE.md
scopes = "read_inventory,read_inventory_transfers,read_locations,read_products,write_inventory,write_inventory_shipments,write_inventory_shipments_received_items,write_inventory_transfers,read_orders"

[auth]
redirect_urls = [ "https://stock-transfer-pos.onrender.com" ]
