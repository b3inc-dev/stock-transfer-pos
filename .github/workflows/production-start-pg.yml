name: Production start HTTP PostgreSQL16 acceptance
on:
  pull_request:
    branches: [main, codex/daily-http-pg-acceptance-2225]
    paths:
      - '.github/workflows/production-start-pg.yml'
      - 'tests/production-start-pg.test.mjs'
      - 'tests/fixtures/production-start-fetch.mjs'
      - 'app/**'
      - 'prisma/**'
permissions:
  contents: read
jobs:
  isolated-production-start:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-local
          POSTGRES_DB: commercor_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d commercor_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:test-only-local@127.0.0.1:5432/commercor_test
      RUN_POS_PG_RECOVERY: '1'
      SHOPIFY_APP_URL: https://runtime-fixture.invalid
      SHOPIFY_API_KEY: '00000000000000000000000000000000'
      SHOPIFY_API_SECRET: synthetic-quality-only
      SCOPES: read_products
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - name: Guard fixture before dependencies or DDL
        run: POS_START_FIXTURE=1 node tests/fixtures/production-start-fetch.mjs guard-only
      - name: Install exact lock without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Generate locked client and disposable PG schema
        run: |
          node_modules/.bin/prisma generate
          node_modules/.bin/prisma db push --skip-generate
      - name: Build the actual application
        run: npm run build
      - name: Exercise npm start and compiled HTTP routing without an adapter
        run: node --test --test-reporter=tap tests/production-start-pg.test.mjs
