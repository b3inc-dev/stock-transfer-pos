name: Restored production start PostgreSQL acceptance
on:
  pull_request:
    branches: [codex/retained-logical-restore-20261128-0325]
    paths:
      - '.github/workflows/restored-production-start.yml'
      - 'tests/restored-production-start-pg.test.mjs'
permissions:
  contents: read
jobs:
  restored-start:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-local
          POSTGRES_DB: commercor_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d commercor_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:test-only-local@127.0.0.1:5432/commercor_test
      RUN_POS_MIGRATION_REHEARSAL: '1'
      RUN_POS_PG_RECOVERY: '1'
      SHOPIFY_APP_URL: https://runtime-fixture.invalid
      SHOPIFY_API_KEY: '00000000000000000000000000000000'
      SHOPIFY_API_SECRET: synthetic-quality-only
      SCOPES: read_products
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - name: Refuse other inputs before dependencies or DDL
        run: |
          node scripts/retained-migration-checkpoint.mjs guard-only
          POS_START_FIXTURE=1 node tests/fixtures/production-start-fetch.mjs guard-only
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Apply versioned migrations and seed the existing positive business fixture before backup
        run: |
          node_modules/.bin/prisma generate
          node_modules/.bin/prisma migrate deploy
          node tests/restored-production-start-pg.test.mjs seed
          node scripts/retained-logical-restore-checkpoint.mjs capture
      - name: Restore only the owned service database and verify captured rows before starting the app
        env:
          FIXTURE_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          node scripts/retained-migration-checkpoint.mjs guard-only
          test "$CI" = true
          test "$GITHUB_ACTIONS" = true
          test -n "$FIXTURE_CONTAINER"
          fixture_dump="$RUNNER_TEMP/restored-production.dump"
          trap 'rm -f "$fixture_dump" "$RUNNER_TEMP/pos-logical-restore-checkpoint.json"' EXIT
          docker exec "$FIXTURE_CONTAINER" pg_dump --version
          docker exec "$FIXTURE_CONTAINER" pg_restore --version
          docker exec "$FIXTURE_CONTAINER" pg_dump -U postgres -d commercor_test --format=custom > "$fixture_dump"
          test -s "$fixture_dump"
          docker exec "$FIXTURE_CONTAINER" dropdb -U postgres commercor_test
          docker exec "$FIXTURE_CONTAINER" createdb -U postgres commercor_test
          docker exec -i "$FIXTURE_CONTAINER" pg_restore -U postgres -d commercor_test --no-owner --no-acl --exit-on-error < "$fixture_dump"
          node scripts/retained-logical-restore-checkpoint.mjs verify
          node_modules/.bin/prisma migrate status
      - name: Build actual unchanged app
        run: npm run build
      - name: Recover the restored observation through compiled server and existing strict child CLI
        run: node --test --test-reporter=tap tests/restored-production-start-pg.test.mjs
      - name: Preserve applied migration state after recovery
        run: node_modules/.bin/prisma migrate status
