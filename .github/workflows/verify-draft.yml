name: Draft build and tests
on: pull_request
permissions:
  contents: read
jobs:
  verify:
    if: github.head_ref == 'verify/repository-check-20261112'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DATABASE_URL: file:./verify.sqlite
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node --test tests/pos-lite-inventory-acceptance.test.mjs
      - run: npm run build
